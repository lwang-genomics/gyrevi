[project]
name = "gyrevi-eval"
version = "0.1.0"
description = "Evaluation harness, circular-statistics metrics and baselines for GyreVI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "scipy>=1.10.0",
    "scanpy>=1.9.0",
    "anndata>=0.9.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.6.0",
]

[project.optional-dependencies]
baselines = ["scvi-tools>=1.3.3", "torch>=2.0.0", "scvelo>=0.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
